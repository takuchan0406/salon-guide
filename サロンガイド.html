<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MHAA | サロンガイド</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#C9727A; --pink-l:#FDF6F6; --pink-m:#F0D0D2; --pink-d:#9B4A51;
  --bg:#FFFFFF; --bg2:#FAFAFA; --ink:#1A1A1A; --muted:#888; --border:#E8E8E8;
  --white:#fff;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Noto Sans JP',sans-serif;
  --radius:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;}

nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:0 2rem;height:56px;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-brand{font-family:var(--serif);font-size:1.2rem;color:var(--ink);letter-spacing:0.06em;font-weight:400;}
.nav-brand small{font-size:0.6rem;color:var(--muted);display:block;letter-spacing:0.12em;font-family:var(--sans);margin-top:1px;}
.nav-links{display:flex;gap:6px;align-items:center;}
.nav-btn{padding:0.4rem 1rem;border-radius:4px;font-size:0.75rem;font-family:var(--sans);cursor:pointer;border:none;font-weight:400;transition:all 0.2s;letter-spacing:0.03em;}
.nav-btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.nav-btn.ghost:hover{color:var(--ink);border-color:#AAA;}
.nav-btn.primary{background:var(--ink);color:#fff;}
.nav-btn.primary:hover{background:#333;}

.page{display:none;}
.page.active{display:block;}

#public{padding-top:56px;}

.hero{background:#fff;padding:5rem 2rem 4rem;text-align:center;border-bottom:1px solid var(--border);}
.hero-eyebrow{font-size:0.68rem;letter-spacing:0.25em;color:var(--muted);margin-bottom:1.2rem;text-transform:uppercase;}
.hero-title{font-family:var(--serif);font-size:clamp(1.6rem,4vw,3rem);color:var(--ink);line-height:1.05;margin-bottom:0.6rem;font-weight:400;letter-spacing:0.02em;}
.hero-title em{color:var(--pink);font-style:italic;}
.hero-sub{font-size:0.85rem;color:var(--muted);margin-bottom:2.5rem;}
.hero-count{display:inline-flex;align-items:center;gap:0.5rem;border:1px solid var(--border);padding:0.5rem 1.4rem;border-radius:30px;font-size:0.82rem;color:var(--muted);}
.hero-count b{font-family:var(--serif);font-size:1.2rem;color:var(--ink);}

.search-wrap{max-width:500px;margin:0 auto;padding:2rem 1.5rem 0;}
.search-bar{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.search-bar input{flex:1;border:none;outline:none;font-size:0.88rem;font-family:var(--sans);background:#fff;color:var(--ink);padding:0.75rem 1rem;}
.search-bar input::placeholder{color:#BBB;}
.search-bar button{background:var(--ink);color:#fff;border:none;padding:0 1.2rem;font-size:0.78rem;font-family:var(--sans);cursor:pointer;letter-spacing:0.04em;}

.filter-wrap{max-width:900px;margin:0 auto;padding:1.2rem 1.5rem 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.filter-label{font-size:0.7rem;color:var(--muted);}
.filter-chip{padding:0.3rem 0.9rem;border-radius:20px;font-size:0.72rem;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;transition:all 0.18s;font-family:var(--sans);}
.filter-chip:hover{border-color:var(--pink);color:var(--pink);}
.filter-chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}

.salons-section{max-width:980px;margin:0 auto;padding:2rem 1.5rem 5rem;}
.salons-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border);}
.salons-header h2{font-family:var(--serif);font-size:1.3rem;color:var(--ink);font-weight:400;letter-spacing:0.04em;}
.salons-count{font-size:0.75rem;color:var(--muted);}
.salon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.5rem;}

.salon-card{background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);transition:box-shadow 0.25s,transform 0.25s;cursor:pointer;}
.salon-card:hover{transform:translateY(-4px);box-shadow:0 10px 32px rgba(0,0,0,0.08);}
.salon-card:nth-child(7n+1){--card-accent:#C9727A;--card-bg:#FDF6F6;}
.salon-card:nth-child(7n+2){--card-accent:#7A9EB0;--card-bg:#F4F8FA;}
.salon-card:nth-child(7n+3){--card-accent:#7AB09A;--card-bg:#F4FAF7;}
.salon-card:nth-child(7n+4){--card-accent:#B09A7A;--card-bg:#FAF7F4;}
.salon-card:nth-child(7n+5){--card-accent:#9A7AB0;--card-bg:#F7F4FA;}
.salon-card:nth-child(7n+6){--card-accent:#B07A7A;--card-bg:#FAF4F4;}
.salon-card:nth-child(7n+7){--card-accent:#7A9A9A;--card-bg:#F4FAFA;}

.card-photos{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;height:160px;gap:1px;background:var(--border);}
.card-photo{overflow:hidden;position:relative;background:var(--card-bg,#FAFAFA);}
.card-photo.main{grid-row:span 2;}
.card-photo img{width:100%;height:100%;object-fit:cover;}
.card-photo .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;opacity:0.2;}
.card-plan{position:absolute;top:8px;left:8px;font-size:0.58rem;font-weight:500;padding:2px 7px;border-radius:2px;color:#fff;letter-spacing:0.04em;}
.plan-full{background:var(--ink);}
.plan-light{background:#999;}
.card-body{padding:1rem;}
.card-num{font-size:0.65rem;color:var(--muted);margin-bottom:3px;letter-spacing:0.08em;}
.card-name-en{font-family:var(--serif);font-size:1.1rem;color:var(--ink);line-height:1.2;font-weight:400;}
.card-name-ja{font-size:0.68rem;color:var(--muted);margin-bottom:0.7rem;}
.card-meta{display:flex;flex-direction:column;gap:3px;margin-bottom:0.7rem;}
.card-meta-row{font-size:0.7rem;color:var(--muted);display:flex;align-items:flex-start;gap:5px;}
.card-meta-icon{color:var(--card-accent,var(--pink));flex-shrink:0;}
.card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:0.75rem;}
.tag{font-size:0.62rem;padding:2px 8px;border-radius:2px;background:var(--card-bg,#FAFAFA);color:var(--card-accent,var(--pink));border:1px solid var(--card-accent,var(--pink));}
.card-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:0.7rem;}
.card-wage{font-size:0.7rem;color:var(--muted);}
.card-wage b{color:var(--ink);}
.card-ig-btn{display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:6px;width:26px;height:26px;cursor:pointer;padding:0;overflow:hidden;}
.card-ig-btn img,.card-ig-btn svg{width:22px;height:22px;}
.card-web-btn{display:flex;align-items:center;justify-content:center;background:#F0F0F0;color:#444;border:none;border-radius:6px;width:26px;height:26px;cursor:pointer;}
.card-web-btn:hover{background:#E0E0E0;}
.card-yt-btn{background:#FF0000;color:#fff;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;padding:0;overflow:hidden;}
.card-yt-btn svg{width:16px;height:16px;flex-shrink:0;}
.modal-link-btn{display:inline-flex;align-items:center;justify-content:center;background:#F5F5F5;color:#333;border:none;border-radius:8px;width:44px;height:44px;cursor:pointer;}
.modal-link-btn:hover{background:#E0E0E0;}
.modal-yt-btn{background:#FF0000;color:#fff;width:44px;height:44px;}
.modal-yt-btn svg{width:26px;height:26px;flex-shrink:0;}

.empty{text-align:center;padding:5rem 1rem;color:var(--muted);}
.empty-icon{font-size:2.5rem;margin-bottom:1rem;opacity:0.3;}
.empty p{font-size:0.88rem;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:300;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:12px 12px 0 0;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;animation:slideUp 0.28s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-photos{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;height:220px;gap:1px;background:var(--border);}
.modal-photo{overflow:hidden;background:#FAFAFA;}
.modal-photo.main{grid-row:span 2;}
.modal-photo img{width:100%;height:100%;object-fit:cover;}
.modal-photo .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem;opacity:0.2;}
.modal-body{padding:1.5rem;}
.modal-num{font-size:0.68rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:3px;}
.modal-name-en{font-family:var(--serif);font-size:1.75rem;color:var(--ink);margin:2px 0;font-weight:400;}
.modal-name-ja{font-size:0.78rem;color:var(--muted);margin-bottom:1.5rem;}
.modal-section{margin-bottom:1.25rem;}
.modal-section-ttl{font-size:0.65rem;letter-spacing:0.14em;font-weight:500;color:var(--muted);margin-bottom:0.7rem;display:flex;align-items:center;gap:8px;text-transform:uppercase;}
.modal-section-ttl::after{content:'';flex:1;height:1px;background:var(--border);}
.modal-meta-row{font-size:0.82rem;color:var(--ink);display:flex;gap:8px;margin-bottom:0.5rem;}
.perk-list{display:flex;flex-direction:column;gap:5px;}
.perk-row{display:flex;align-items:baseline;gap:8px;font-size:0.82rem;color:var(--ink);}
.perk-dot{width:4px;height:4px;border-radius:50%;background:var(--pink);flex-shrink:0;margin-top:5px;}
.job-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;}
.job-key{font-size:0.78rem;color:var(--muted);}
.job-val{font-size:0.78rem;color:var(--ink);}
.modal-ig-btn{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:8px;width:44px;height:44px;cursor:pointer;padding:0;overflow:hidden;}
.modal-ig-btn img,.modal-ig-btn svg{width:36px;height:36px;}
.modal-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid var(--border);color:var(--ink);font-size:0.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;}

#admin{padding-top:56px;}
.admin-inner{max-width:860px;margin:0 auto;padding:2rem 1.5rem 5rem;}
.admin-header{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border);}
.admin-header h1{font-family:var(--serif);font-size:1.8rem;color:var(--ink);font-weight:400;}
.admin-header p{font-size:0.82rem;color:var(--muted);margin-top:6px;line-height:1.7;}
.salon-list-admin{display:flex;flex-direction:column;gap:0.75rem;}
.salon-item-admin{background:#fff;border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;transition:border-color 0.2s;}
.salon-item-admin:hover{border-color:#BBB;}
.salon-item-header{display:flex;align-items:center;gap:1rem;padding:1rem 1.25rem;cursor:pointer;transition:background 0.15s;}
.salon-item-header:hover{background:var(--bg2);}
.salon-item-num{font-family:var(--serif);font-size:1.3rem;color:var(--muted);min-width:2rem;font-weight:400;}
.salon-item-name{flex:1;}
.salon-item-name-en{font-family:var(--serif);font-size:0.95rem;color:var(--ink);font-weight:400;}
.salon-item-name-ja{font-size:0.7rem;color:var(--muted);}
.salon-item-status{display:flex;align-items:center;gap:5px;}
.status-dot{width:6px;height:6px;border-radius:50%;}
.status-dot.filled{background:#4CAF50;}
.status-dot.empty{background:#DDD;}
.status-text{font-size:0.68rem;color:var(--muted);}
.chevron{font-size:0.75rem;color:var(--muted);transition:transform 0.2s;}
.chevron.open{transform:rotate(180deg);}
.salon-form{display:none;padding:0 1.25rem 1.25rem;border-top:1px solid var(--border);}
.salon-form.open{display:block;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-top:1rem;}
.form-field{display:flex;flex-direction:column;gap:4px;}
.form-field.full{grid-column:span 2;}
.form-field label{font-size:0.68rem;color:var(--muted);letter-spacing:0.06em;}
.form-field input,.form-field textarea,.form-field select{border:1px solid var(--border);border-radius:4px;padding:0.6rem 0.8rem;font-size:0.85rem;font-family:var(--sans);color:var(--ink);outline:none;background:#fff;transition:border-color 0.2s;width:100%);}
.form-field input:focus,.form-field textarea:focus{border-color:var(--ink);}
.form-field textarea{resize:vertical;min-height:70px;}
.form-section-ttl{font-size:0.65rem;letter-spacing:0.12em;color:var(--muted);margin:1.2rem 0 0.6rem;display:flex;align-items:center;gap:8px;text-transform:uppercase;}
.form-section-ttl::after{content:'';flex:1;height:1px;background:var(--border);}
.photo-upload-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:0.5rem;}
.photo-upload-slot{aspect-ratio:4/3;border:1px dashed #CCC;border-radius:4px;cursor:pointer;overflow:hidden;position:relative;background:#FAFAFA;transition:border-color 0.2s;}
.photo-upload-slot:hover,.photo-upload-slot.over{border-color:var(--ink);}
.photo-upload-slot input{display:none;}
.photo-upload-slot img{width:100%;height:100%;object-fit:cover;display:none;}
.photo-upload-slot .pu-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:0.62rem;color:#BBB;pointer-events:none;}
.photo-upload-slot .pu-ph .ico{font-size:1.3rem;}
.pu-rm{position:absolute;top:4px;right:4px;background:var(--ink);color:#fff;border:none;border-radius:3px;font-size:0.58rem;padding:2px 6px;cursor:pointer;display:none;z-index:2;}
.photo-upload-slot:hover .pu-rm{display:block;}
.plan-selector{display:flex;gap:8px;margin-top:0.5rem;}
.plan-opt{flex:1;padding:0.65rem;border:1px solid var(--border);border-radius:4px;text-align:center;cursor:pointer;transition:all 0.18s;}
.plan-opt:hover{border-color:#AAA;}
.plan-opt.selected.full-plan{border-color:var(--ink);background:var(--ink);}
.plan-opt.selected.full-plan .plan-opt-name,.plan-opt.selected.full-plan .plan-opt-price{color:#fff;}
.plan-opt.selected.light-plan{border-color:var(--pink);background:var(--pink-l);}
.plan-opt-name{font-size:0.78rem;font-weight:500;color:var(--ink);}
.plan-opt-price{font-size:0.65rem;color:var(--muted);margin-top:2px;}
.form-actions{display:flex;gap:8px;margin-top:1.25rem;}
.save-btn{background:var(--ink);color:#fff;border:none;border-radius:4px;padding:0.7rem 1.5rem;font-size:0.82rem;font-family:var(--sans);font-weight:400;cursor:pointer;flex:1;letter-spacing:0.04em;transition:background 0.2s;}
.save-btn:hover{background:#333;}
.clear-btn{background:#fff;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0.7rem 1rem;font-size:0.82rem;font-family:var(--sans);cursor:pointer;}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:#fff;padding:0.7rem 1.5rem;border-radius:4px;font-size:0.8rem;z-index:500;transition:transform 0.3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

.pw-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:400;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
.pw-overlay.open{display:flex;}
.pw-modal{background:#fff;border-radius:8px;padding:2.5rem 2rem;width:90%;max-width:300px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.15);animation:popIn 0.22s ease;}
@keyframes popIn{from{transform:scale(0.95);opacity:0}to{transform:scale(1);opacity:1}}
.pw-icon{font-size:1.8rem;margin-bottom:1rem;opacity:0.4;}
.pw-title{font-family:var(--serif);font-size:1.4rem;color:var(--ink);margin-bottom:4px;font-weight:400;}
.pw-sub{font-size:0.75rem;color:var(--muted);margin-bottom:1.25rem;}
.pw-input{width:100%;border:1px solid var(--border);border-radius:4px;padding:0.7rem;font-size:1.2rem;text-align:center;letter-spacing:0.4em;font-family:var(--sans);outline:none;transition:border-color 0.2s;margin-bottom:0.5rem;}
.pw-input:focus{border-color:var(--ink);}
.pw-error{font-size:0.72rem;color:var(--pink);min-height:1.2rem;margin-bottom:0.5rem;}
.pw-btn{width:100%;background:var(--ink);color:#fff;border:none;border-radius:4px;padding:0.72rem;font-size:0.85rem;font-family:var(--sans);cursor:pointer;margin-bottom:0.5rem;letter-spacing:0.04em;}
.pw-btn:hover{background:#333;}
.pw-cancel{background:none;border:none;color:var(--muted);font-size:0.78rem;font-family:var(--sans);cursor:pointer;}

@media(max-width:600px){
  .form-grid{grid-template-columns:1fr;}
  .form-field.full{grid-column:span 1;}
  .photo-upload-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<!-- ── ナビ ── -->
<nav>
  <div class="nav-brand">
    MHAA
    <small>サロンガイド</small>
  </div>
  <div class="nav-links">
    <button class="nav-btn ghost" onclick="showPage('public')">🏠 サロン一覧</button>
  </div>
</nav>

<!-- ══════════════════════════════════════════
     PUBLIC PAGE
══════════════════════════════════════════ -->
<div id="public" class="page active">

  <!-- ヒーロー -->
  <div class="hero">
    <div class="hero-eyebrow">ミエ・ヘア・アーチストアカデミー</div>
    <h1 class="hero-title">サロンガイド</h1>
    <p class="hero-sub"></p>
    <div class="hero-count">
      <b id="hero-count">0</b> サロン掲載中
    </div>
  </div>

  <!-- 検索 -->
  <div class="search-wrap">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="サロン名・住所で検索..." oninput="filterSalons()">
      <button onclick="filterSalons()">検索</button>
    </div>
  </div>

  <!-- フィルター -->
  <div class="filter-wrap">
    <span class="filter-label">絞り込み：</span>
    <button class="filter-chip on" data-filter="all" onclick="setFilter(this,'all')">すべて</button>
    <button class="filter-chip" data-filter="full" onclick="setFilter(this,'full')">パートナーサロン</button>
  </div>

  <!-- サロン一覧 -->
  <div class="salons-section">
    <div class="salons-header">
      <h2>掲載サロン一覧</h2>
      <span class="salons-count" id="salons-count">0件</span>
    </div>
    <div class="salon-grid" id="salon-grid"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     ADMIN PAGE
══════════════════════════════════════════ -->
<div id="admin" class="page">
  <div class="admin-inner">
  <div class="admin-header">
    <h1>サロン管理画面</h1>
    <p>サロン情報を入力すると、公開ページにリアルタイムで反映されます。写真はドラッグ＆ドロップで追加できます。</p>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:1rem;gap:8px;">
    <button class="save-btn" style="flex:none;padding:0.55rem 1.2rem;font-size:0.8rem;" onclick="addSalon()">＋ サロンを追加</button>
  </div>
  <div class="salon-list-admin" id="salon-list-admin"></div>
  </div>
</div>

<!-- ── 詳細モーダル ── -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-inner"></div>
  </div>
</div>

<!-- ── パスワードモーダル ── -->
<div class="pw-overlay" id="pw-overlay">
  <div class="pw-modal">
    <div class="pw-icon">🔑</div>
    <div class="pw-title">管理画面</div>
    <div class="pw-sub">パスワードを入力してください</div>
    <input class="pw-input" type="password" id="pw-input" placeholder="••••"
      onkeydown="if(event.key==='Enter')checkPw()">
    <div class="pw-error" id="pw-error"></div>
    <button class="pw-btn" onclick="checkPw()">入る</button>
    <button class="pw-cancel" onclick="closePwModal()">キャンセル</button>
  </div>
</div>

<!-- トースト -->
<div class="toast" id="toast"></div>

function loadSalons() {
  const raw = localStorage.getItem('riku_salons_v2');
  if (raw) return JSON.parse(raw);
  return [DEMO_SALON, SALON2, SALON3, SALON4];
}

function saveSalons() {
  localStorage.setItem('riku_salons_v2', JSON.stringify(salons));
}

let salons = loadSalons();
let currentFilter = 'all';
let openModal = null;

// ── 郵便番号 → 住所自動入力 ────────────────────────────────────────
async function autoFillAddr(id) {
  const zipEl    = document.getElementById(`fi-zip-${id}`);
  const addrEl   = document.getElementById(`fi-addr-${id}`);
  const loadEl   = document.getElementById(`zip-loading-${id}`);
  const raw      = zipEl.value.replace(/[^0-9]/g, '');
  if (raw.length !== 7) return;

  loadEl.style.display = 'inline';
  try {
    const res  = await fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${raw}`);
    const data = await res.json();
    if (data.results && data.results.length > 0) {
      const r = data.results[0];
      const addr = r.address1 + r.address2 + r.address3;
      addrEl.value = addr;
      // 〒付きで郵便番号を整形
      zipEl.value = `〒${raw.slice(0,3)}-${raw.slice(3)}`;
      showToast('📍 住所を自動入力しました');
    } else {
      showToast('住所が見つかりませんでした');
    }
  } catch(e) {
    showToast('住所の取得に失敗しました');
  } finally {
    loadEl.style.display = 'none';
  }
}

// ── パスワード ────────────────────────────────────────────────────
const PW = '2525';
let adminUnlocked = false;

function requestAdmin() {
  if (adminUnlocked) { showPage('admin'); return; }
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-error').textContent = '';
  document.getElementById('pw-overlay').classList.add('open');
  setTimeout(() => document.getElementById('pw-input').focus(), 100);
}

function checkPw() {
  const val = document.getElementById('pw-input').value;
  if (val === PW) {
    adminUnlocked = true;
    closePwModal();
    showPage('admin');
  } else {
    document.getElementById('pw-error').textContent = 'パスワードが違います';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}

function closePwModal() {
  document.getElementById('pw-overlay').classList.remove('open');
}

// ── ページ切替 ─────────────────────────────────────────────────────
function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(page).classList.add('active');
  window.scrollTo(0, 0);
  if (page === 'public') renderPublic();
  if (page === 'admin') renderAdmin();
}

// ══════════════════════════════════════════
// PUBLIC
// ══════════════════════════════════════════
function filterSalons() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const visible = salons.filter(s => {
    if (!s.nameEn) return false;
    const matchFilter = currentFilter === 'all' || s.plan === currentFilter;
    const matchQ = !q ||
      s.nameEn.toLowerCase().includes(q) ||
      s.nameJa.includes(q) ||
      s.addr.includes(q);
    return matchFilter && matchQ;
  });
  renderCards(visible);
}

function setFilter(el, val) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  currentFilter = val;
  filterSalons();
}

function renderPublic() {
  const filled = salons.filter(s => s.nameEn);
  document.getElementById('hero-count').textContent = filled.length;
  filterSalons();
}

function renderCards(list) {
  const grid = document.getElementById('salon-grid');
  document.getElementById('salons-count').textContent = list.length + '件';

  if (!list.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="empty-icon">🌸</div>
      <p>サロンが見つかりませんでした</p>
    </div>`;
    return;
  }

  grid.innerHTML = list.map(s => {
    const igHandle = s.ig ? s.ig.replace('@','').trim() : '';
    const igHref = igHandle ? (igHandle.startsWith('http') ? igHandle : `https://instagram.com/${igHandle}`) : '';
    return `
    <div class="salon-card" onclick="openSalonModal(${s.id})">
      <div class="card-photos">
        <div class="card-photo main">
          ${s.photos[0] ? `<img src="${s.photos[0]}" alt="${s.nameEn}">` : `<div class="ph">✦</div>`}
          ${s.plan === 'full' ? `<span class="card-plan plan-full">パートナーサロン</span>` : ''}
        </div>
        <div class="card-photo">${s.photos[1] ? `<img src="${s.photos[1]}">` : `<div class="ph" style="font-size:1rem">📷</div>`}</div>
        <div class="card-photo">${s.photos[2] ? `<img src="${s.photos[2]}">` : `<div class="ph" style="font-size:1rem">📷</div>`}</div>
      </div>
      <div class="card-body">
        <div class="card-num">No. ${String(s.id).padStart(2,'0')}</div>
        <div class="card-name-en">${s.nameEn}</div>
        <div class="card-name-ja">${s.nameJa}</div>
        <div class="card-meta">
          ${s.addr ? `<div class="card-meta-row"><span class="card-meta-icon">📍</span>${s.zip} ${s.addr}</div>` : ''}
          ${s.tel ? `<div class="card-meta-row"><span class="card-meta-icon">📞</span>${s.tel}</div>` : ''}
        </div>
        <div class="card-tags">
          ${s.perks.filter(Boolean).slice(0,2).map(p => `<span class="tag">${p}</span>`).join('')}
        </div>
        <div class="card-footer">
          <div class="card-wage">${s.wage ? `時給 <b>${s.wage}</b>` : ''}</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;">
            ${igHref ? `<button class="card-ig-btn" onclick="event.stopPropagation();window.open('${igHref}','_blank','noopener')">${igSvg()}</button>` : ''}
            ${s.tiktok ? `<button class="card-ig-btn" style="color:#010101;" onclick="event.stopPropagation();window.open('${s.tiktok}','_blank','noopener')">${tiktokSvg()}</button>` : ''}
            ${s.website ? `<button class="card-web-btn" onclick="event.stopPropagation();window.open('${s.website}','_blank','noopener')">${webSvg()}</button>` : ''}
            ${s.youtube ? `<button class="card-yt-btn" onclick="event.stopPropagation();window.open('${s.youtube}','_blank','noopener')">${ytSvg()}</button>` : ''}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openSalonModal(id) {
  const s = salons.find(x => x.id === id);
  if (!s) return;
  openModal = id;

  const photos = s.photos.slice(0,3).map((p,i) => {
    const tag = i === 0 ? 'main' : '';
    return `<div class="modal-photo ${tag}">
      ${p ? `<img src="${p}" alt="写真${i+1}">` : `<div class="ph">📷</div>`}
    </div>`;
  });

  const igHandle = s.ig ? s.ig.replace('@','').trim() : '';
  const igHref = igHandle ? (igHandle.startsWith('http') ? igHandle : `https://instagram.com/${igHandle}`) : '';

  document.getElementById('modal-inner').innerHTML = `
    <div class="modal-photos">
      ${photos[0]}
      <div style="display:flex;flex-direction:column;gap:1px;">
        ${photos[1]}${photos[2]}
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-num">No. ${String(s.id).padStart(2,'0')}${s.plan === 'full' ? ' — パートナーサロン' : ''}</div>
      <div class="modal-name-en">${s.nameEn}</div>
      <div class="modal-name-ja">${s.nameJa}</div>

      ${s.info ? `
      <div class="modal-section">
        <div class="modal-section-ttl">サロン情報</div>
        <div style="font-size:.85rem;line-height:1.7;color:var(--text);">${s.info}</div>
      </div>` : ''}

      <div class="modal-section">
        <div class="modal-section-ttl">アクセス</div>
        ${s.zip || s.addr ? `<div class="modal-meta-row"><span style="color:var(--muted);width:60px;flex-shrink:0;">住所</span>${s.zip} ${s.addr}</div>` : ''}
        ${s.tel ? `<div class="modal-meta-row"><span style="color:var(--muted);width:60px;flex-shrink:0;">電話</span>${s.tel}</div>` : ''}
      </div>

      ${s.perks.filter(Boolean).length ? `
      <div class="modal-section">
        <div class="modal-section-ttl">学生限定特典</div>
        <div class="perk-list">
          ${s.perks.filter(Boolean).map(p => `<div class="perk-row"><div class="perk-dot"></div>${p}</div>`).join('')}
        </div>
      </div>` : ''}

      ${s.wage || s.days || s.hours ? `
      <div class="modal-section">
        <div class="modal-section-ttl">アルバイト情報</div>
        <div class="job-grid">
          ${s.wage ? `<span class="job-key">時給</span><span class="job-val">${s.wage}</span>` : ''}
          ${s.days ? `<span class="job-key">勤務日数</span><span class="job-val">${s.days}</span>` : ''}
          ${s.hours ? `<span class="job-key">時間</span><span class="job-val">${s.hours}</span>` : ''}
        </div>
      </div>` : ''}

      <div style="display:flex;flex-direction:row;gap:8px;justify-content:center;">
        ${igHref ? `<button class="modal-ig-btn" onclick="window.open('${igHref}','_blank','noopener')">${igSvg()}</button>` : ''}
        ${s.tiktok ? `<button class="modal-ig-btn" style="color:#010101;" onclick="window.open('${s.tiktok}','_blank','noopener')">${tiktokSvg()}</button>` : ''}
        ${s.website ? `<button class="modal-link-btn" onclick="window.open('${s.website}','_blank','noopener')">${webSvg()}</button>` : ''}
        ${s.youtube ? `<button class="modal-link-btn modal-yt-btn" onclick="window.open('${s.youtube}','_blank','noopener')">${ytSvg()}</button>` : ''}
      </div>
    </div>`;

  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay') && !e.target.classList.contains('modal-close')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}

function webSvg(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;
}

function ytSvg(){
  return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`;
}

function igUrl(ig) {
  const handle = ig.replace('@','').trim();
  return handle.startsWith('http') ? handle : `https://instagram.com/${handle}`;
}
function igSvg() {
  return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
      <radialGradient id="ig-rg" cx="30%" cy="107%" r="150%">
        <stop offset="0%" stop-color="#fdf497"/>
        <stop offset="5%" stop-color="#fdf497"/>
        <stop offset="45%" stop-color="#fd5949"/>
        <stop offset="60%" stop-color="#d6249f"/>
        <stop offset="90%" stop-color="#285AEB"/>
      </radialGradient>
    </defs>
    <rect width="24" height="24" rx="6" fill="url(#ig-rg)"/>
    <rect x="2" y="2" width="20" height="20" rx="5" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="4.5" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="17.5" cy="6.5" r="1.2" fill="white"/>
  </svg>`;
}

// ══════════════════════════════════════════
// ADMIN
// ══════════════════════════════════════════
function renderAdmin() {
  const list = document.getElementById('salon-list-admin');
  list.innerHTML = salons.map(s => adminItem(s)).join('');
}

function adminItem(s) {
  const filled = !!s.nameEn;
  return `
  <div class="salon-item-admin" id="admin-item-${s.id}">
    <div class="salon-item-header" onclick="toggleForm(${s.id})">
      <div class="salon-item-num">${String(s.id).padStart(2,'0')}</div>
      <div class="salon-item-name">
        <div class="salon-item-name-en">${s.nameEn || 'サロン未入力'}</div>
        <div class="salon-item-name-ja">${s.nameJa || '—'}</div>
      </div>
      <div class="salon-item-status">
        <div class="status-dot ${filled ? 'filled' : 'empty'}"></div>
        <span class="status-text">${filled ? '入力済み' : '未入力'}</span>
      </div>
      <span class="chevron" id="chev-${s.id}">▾</span>
    </div>
    <div class="salon-form" id="form-${s.id}">
      ${adminForm(s)}
    </div>
  </div>`;
}

function adminForm(s) {
  const photos = [0,1,2].map(i => `
    <div>
      <div class="photo-upload-slot" id="pu-${s.id}-${i}"
           onclick="document.getElementById('pufi-${s.id}-${i}').click()"
           ondragover="event.preventDefault();this.classList.add('over')"
           ondragleave="this.classList.remove('over')"
           ondrop="handlePhotoDrop(event,${s.id},${i})">
        <input type="file" id="pufi-${s.id}-${i}" accept="image/*"
               onchange="handlePhotoFile(${s.id},${i},this)">
        <img id="pu-img-${s.id}-${i}" ${s.photos[i] ? `src="${s.photos[i]}" style="display:block"` : 'style="display:none"'}>
        <div class="pu-ph" id="pu-ph-${s.id}-${i}" style="${s.photos[i] ? 'display:none' : ''}">
          <span class="ico">📷</span>
          <span>写真</span>
        </div>
        ${s.photos[i] ? `<button class="pu-rm" onclick="event.stopPropagation();removePhoto(${s.id},${i})">✕</button>` : ''}
      </div>
    </div>`).join('');

  return `
  <div class="form-section-ttl">プラン選択</div>
  <div class="plan-selector">
    <div class="plan-opt full-plan ${s.plan==='full'?'selected':''}" onclick="setPlan(${s.id},'full',this.parentNode)">
      <div class="plan-opt-name">🌸 フルプラン</div>
      <div class="plan-opt-price">¥55,000 / パートナーサロン＋サポート</div>
    </div>
    <div class="plan-opt light-plan ${s.plan==='light'?'selected':''}" onclick="setPlan(${s.id},'light',this.parentNode)">
      <div class="plan-opt-name">📄 ライトプラン</div>
      <div class="plan-opt-price">¥19,800 / 掲載のみ</div>
    </div>
  </div>

  <div class="form-section-ttl">基本情報</div>
  <div class="form-grid">
    <div class="form-field">
      <label>サロン名（英語）</label>
      <input id="fi-nameEn-${s.id}" value="${s.nameEn}" placeholder="例: HAIR SPACE bloom">
    </div>
    <div class="form-field">
      <label>サロン名（カタカナ）</label>
      <input id="fi-nameJa-${s.id}" value="${s.nameJa}" placeholder="例: ヘアスペース ブルーム">
    </div>
    <div class="form-field">
      <label>電話番号</label>
      <input id="fi-tel-${s.id}" value="${s.tel}" placeholder="059-222-1234">
    </div>
    <div class="form-field">
      <label>郵便番号</label>
      <div style="display:flex;gap:6px;align-items:center;">
        <input id="fi-zip-${s.id}" value="${s.zip}" placeholder="1234567（ハイフン不要）"
          oninput="autoFillAddr(${s.id})" style="flex:1;">
        <span id="zip-loading-${s.id}" style="font-size:0.7rem;color:var(--muted);display:none;">検索中…</span>
      </div>
    </div>
    <div class="form-field full">
      <label>住所</label>
      <input id="fi-addr-${s.id}" value="${s.addr}" placeholder="三重県津市栄町1-123-1">
    </div>
    <div class="form-field full">
      <label>Instagram（@なし or @付き どちらでもOK）</label>
      <input id="fi-ig-${s.id}" value="${s.ig}" placeholder="@hairspace_bloom">
    </div>
    <div class="form-field full">
      <label>ホームページ URL</label>
      <input id="fi-website-${s.id}" value="${s.website||''}" placeholder="https://example.com">
    </div>
    <div class="form-field full">
      <label>YouTube URL</label>
      <input id="fi-youtube-${s.id}" value="${s.youtube||''}" placeholder="https://youtube.com/@channel">
    </div>
  </div>

  <div class="form-section-ttl">写真（ドラッグ＆ドロップ or クリックで追加・3枚まで）</div>
  <div class="photo-upload-grid">${photos}</div>

  <div class="form-section-ttl">学生限定特典</div>
  <div class="form-grid">
    <div class="form-field full"><input id="fi-p0-${s.id}" value="${s.perks[0]}" placeholder="特典1（例：カット 50%OFF）"></div>
    <div class="form-field full"><input id="fi-p1-${s.id}" value="${s.perks[1]}" placeholder="特典2（例：トリートメント無料）"></div>
    <div class="form-field full"><input id="fi-p2-${s.id}" value="${s.perks[2]}" placeholder="特典3（例：撮影カット無料）"></div>
  </div>

  <div class="form-section-ttl">アルバイト情報</div>
  <div class="form-grid">
    <div class="form-field">
      <label>時給</label>
      <input id="fi-wage-${s.id}" value="${s.wage}" placeholder="1,050円〜">
    </div>
    <div class="form-field">
      <label>勤務日数</label>
      <input id="fi-days-${s.id}" value="${s.days}" placeholder="週2日〜OK">
    </div>
    <div class="form-field full">
      <label>勤務時間</label>
      <input id="fi-hours-${s.id}" value="${s.hours}" placeholder="応相談">
    </div>
  </div>

  <div class="form-actions">
    <button class="clear-btn" onclick="clearSalon(${s.id})">クリア</button>
    <button class="save-btn" onclick="saveSalon(${s.id})">💾 保存して公開に反映</button>
  </div>`;
}

function toggleForm(id) {
  const form = document.getElementById(`form-${id}`);
  const chev = document.getElementById(`chev-${id}`);
  const isOpen = form.classList.contains('open');
  form.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
}

function setPlan(id, plan, container) {
  salons.find(s => s.id === id).plan = plan;
  container.querySelectorAll('.plan-opt').forEach(el => el.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
}

function saveSalon(id) {
  const s = salons.find(x => x.id === id);
  s.nameEn = v(`fi-nameEn-${id}`);
  s.nameJa = v(`fi-nameJa-${id}`);
  s.zip    = v(`fi-zip-${id}`);
  s.addr   = v(`fi-addr-${id}`);
  s.tel    = v(`fi-tel-${id}`);
  s.ig      = v(`fi-ig-${id}`);
  s.website = v(`fi-website-${id}`);
  s.youtube = v(`fi-youtube-${id}`);
  s.perks  = [v(`fi-p0-${id}`), v(`fi-p1-${id}`), v(`fi-p2-${id}`)];
  s.wage   = v(`fi-wage-${id}`);
  s.days   = v(`fi-days-${id}`);
  s.hours  = v(`fi-hours-${id}`);
  s.visible = true;
  saveSalons();

  // ステータス更新
  const item = document.getElementById(`admin-item-${id}`);
  const dot  = item.querySelector('.status-dot');
  const txt  = item.querySelector('.status-text');
  const nen  = item.querySelector('.salon-item-name-en');
  const nja  = item.querySelector('.salon-item-name-ja');
  dot.className = 'status-dot filled';
  txt.textContent = '入力済み';
  nen.textContent = s.nameEn || 'サロン未入力';
  nja.textContent = s.nameJa || '—';

  showToast('💾 保存しました！公開ページに反映されました');
}

function clearSalon(id) {
  if (!confirm('このサロンの入力内容をすべてクリアしますか？')) return;
  const s = salons.find(x => x.id === id);
  Object.assign(s, {nameEn:'',nameJa:'',zip:'',addr:'',tel:'',ig:'',
    photos:[null,null,null,null],qr:null,perks:['','',''],wage:'',days:'',hours:'',visible:false});
  saveSalons();
  // フォーム再描画
  document.getElementById(`form-${id}`).innerHTML = adminForm(s);
  showToast('🗑 クリアしました');
}

// 写真処理
function handlePhotoFile(id, idx, input) {
  if (!input.files[0]) return;
  readImg(input.files[0], src => applyAdminPhoto(id, idx, src));
}
function handlePhotoDrop(e, id, idx) {
  e.preventDefault();
  const el = e.currentTarget; el.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) readImg(f, src => applyAdminPhoto(id, idx, src));
}
function applyAdminPhoto(id, idx, src) {
  salons.find(s => s.id === id).photos[idx] = src;
  const img = document.getElementById(`pu-img-${id}-${idx}`);
  const ph  = document.getElementById(`pu-ph-${id}-${idx}`);
  img.src = src; img.style.display = 'block';
  ph.style.display = 'none';
}
function removePhoto(id, idx) {
  salons.find(s => s.id === id).photos[idx] = null;
  const img = document.getElementById(`pu-img-${id}-${idx}`);
  const ph  = document.getElementById(`pu-ph-${id}-${idx}`);
  img.src = ''; img.style.display = 'none';
  ph.style.display = '';
}
function addSalon() {
  TOTAL++;
  localStorage.setItem('riku_total', TOTAL);
  salons.push({
    id: TOTAL,
    nameEn:'', nameJa:'', zip:'', addr:'', tel:'', ig:'',
    photos:[null,null,null], qr:null,
    perks:['','',''],
    wage:'', days:'', hours:'',
    youtube:'', website:'',
    plan:'full', visible:false,
  });
  renderAdmin();
  // 最後のアイテムへスクロール
  setTimeout(() => {
    const items = document.querySelectorAll('.salon-item-admin');
    items[items.length-1]?.scrollIntoView({behavior:'smooth', block:'start'});
  }, 100);
  showToast(`✅ サロン${TOTAL}を追加しました`);
}

function readImg(file, cb) {
  const r = new FileReader();
  r.onload = e => cb(e.target.result);
  r.readAsDataURL(file);
}

function v(id) { return document.getElementById(id)?.value || ''; }

function tiktokSvg() {
  return `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.75a4.85 4.85 0 01-1.01-.06z" fill="currentColor"/>
  </svg>`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// 初期描画（デモデータ更新のためキャッシュリセット）
localStorage.removeItem('riku_salons_v2');
salons = loadSalons();
renderPublic();
renderAdmin();
</script>
</body>
</html>
